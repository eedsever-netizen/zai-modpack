[entity-name]
zai-stm-t1=Паукотрон-рудокоп T1
zai-stm-t2=Паукотрон-рудокоп T2
zai-stm-t3=Паукотрон-рудокоп T3

[entity-description]
zai-stm-t1=Самодельная машина добычи первого уровня. Топливо — любое горючее. Тёмно-ржавая, обгоревшая разбитая машина. Маленькая сетка оборудования.
zai-stm-t2=Паукотрон-рудокоп второго уровня. Улучшенный топливный двигатель, средняя сетка оборудования. Старая машина с полувыцветшей синей краской.
zai-stm-t3=Паукотрон-рудокоп третьего уровня. Burner с почти нулевыми выбросами (симулирует электрический), крупная сетка оборудования. Воронёная (синеватая) сталь.

[item-name]
zai-stm-t1=Паукотрон-рудокоп T1
zai-stm-t2=Паукотрон-рудокоп T2
zai-stm-t3=Паукотрон-рудокоп T3
zai-stm-designator=Маркер области добычи

[item-description]
zai-stm-t1=Переделанный старый автомобиль. Добывает ресурсы вместо буровой установки.
zai-stm-t2=Улучшенная версия паукотрона-рудокопа. Лучше эффективность, больше багажник и сетка оборудования.
zai-stm-t3=Топовая версия: низкоэмиссионный burner, крупная сетка оборудования, воронёная сталь.
zai-stm-designator=Выделите рамкой область — ближайший паукотрон-рудокоп добудет ресурсы в ней.

[recipe-name]
zai-stm-t1=Собрать паукотрон-рудокоп T1
zai-stm-t2=Собрать паукотрон-рудокоп T2
zai-stm-t3=Собрать паукотрон-рудокоп T3

[recipe-description]
zai-stm-t1=Собрать простейшую машину добычи: топливную, ржавую, для старта.
zai-stm-t2=Переработать T1 в T2: после красной ленты, стали и автоматизации.
zai-stm-t3=Переработать T2 в T3: после аккумуляторов.

[technology-name]
zai-stm-t2=Паукотрон-рудокоп T2
zai-stm-t3=Паукотрон-рудокоп T3

[technology-description]
zai-stm-t2=Улучшение паукотрона-рудокопа: прочнее, эффективнее, больше сетка оборудования. Требует автоматизацию и сталь.
zai-stm-t3=Топовая версия паукотрона-рудокопа: низкоэмиссионный burner, крупная сетка оборудования. Требует аккумуляторы.

[shortcut-name]
zai-stm-toggle-auto=Авто-режим паукотрона

[shortcut-description]
zai-stm-toggle-auto=Переключить авто-режим ближайшего паукотрона-рудокопа. В авто-режиме машина каждую секунду добывает ближайший ресурс указанного типа в радиусе 25 тайлов.

