[entity-description]
zai-stm-t1=Tier-1 mining machine. Fuel: any burnable. Dark rusty burnt-out car. Small equipment grid.
zai-stm-t2=Tier-2 spidertron-miner. Improved burner engine, medium equipment grid. Old car with faded blue paint.
zai-stm-t3=Tier-3 spidertron-miner. Low-emissions burner (simulates electric), large equipment grid. Blued steel.

