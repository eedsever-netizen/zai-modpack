[item-description]
zai-stm-t1=Repurposed old car. Mines resources instead of a drill.
zai-stm-t2=Improved spidertron-miner. Better efficiency, bigger trunk and grid.
zai-stm-t3=Top tier: low-emissions burner, large equipment grid, blued steel.
zai-stm-designator=Select an area — the nearest spidertron-miner will mine the resources in it.

