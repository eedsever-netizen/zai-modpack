[tips-and-tricks-description]
; --- angelsaddons-cab ---
angelsaddons-cab= highly experimental crawler is an drivable транспорт that можно draw и provide энергия to a сеть. этот можно allow для a temporary mobile crafting site пока out exploring  map. More features — planned.
angelsaddons-cab-notes=\n\n[шрифт=default-bold]NOTES[/шрифт]: To operate simply set  транспорт in развёрнут mode to provide  энергия to  сеть  транспорт is residing in.\nPower may be supplied by mobile generators or specialised charged batteries.
; --- angelsaddons-mobility ---
angelsaddons-mobility=этот mod adds a variety из angels themed поезда independently из angels modset.\nThe three themed поезда include [img=предмет/angels-crawler-локомотив]Crawler, [img=предмет/angels-плавка-локомотив]плавка, и [img=предмет/angels-petro-локомотив]нефтехим.\nEach поезд theme has different working values such as mass, энергия, capacity, braking, и max speed.\n\n[шрифт=default-bold]NOTES[/шрифт]: Each поезд (с some малый exceptions) has compatible copy/паста information including schedule, цвет, и these — also blueprint compatible.
angelsaddons-mobility-notes=\n[шрифт=default-bold]NOTES[/шрифт]:Tenders — locomotives с high air resistance, but high энергия, good as a secondary локомотив для larger поезда.\n[шрифт=default-bold]NOTES[/шрифт]:Bot wagons — груз wagons which можно use робопорт equipment.
; --- angelsaddons-storage ---
angelsaddons-storage=этот mod adds a variety из angels silos, warehouses и pressure tanks independently из angels modset.
angelsaddons-storage-notes=\n\n[шрифт=default-bold]NOTES[/шрифт]: Silos — 4x4 storage boxes с 256 slots (logistics versions vary)\n[шрифт=default-bold]NOTES[/шрифт]: Warehouses — 6x6 storage boxes с 768 slots (logistics versions vary)\n[шрифт=default-bold]NOTES[/шрифт]: жидкость storage tanks contain larger volumes than vanilla
; --- angelsbioprocessing ---
angels-animals-notes-biters=\n\n[шрифт=default-bold]BITERS[/шрифт]: Do some experiments on your Puffers и maybe you можно breed some tame biters yourself. Study them in order to obtain crystals, which можно come in handy to увеличить your factory productivity or speed them up.\nBreeding  biters using queens можно give all three tiers из crystals ([img=предмет/angels-кристалл-splinter-raw]Splinters, [img=предмет/angels-кристалл-осколок-raw] Shards и [img=предмет/angels-кристалл-full-raw] Raw) based on  size (малый, средний, big respectively).\n[шрифт=default-bold]NOTES:[/шрифт] Biters will eat quite a lot из [img=предмет/angels-био-инопланетный-processed-meat] инопланетный-processed meat, so make sure you have plenty из [img=предмет/angels-био-butchery] butchered puffers и рыба available once you get to этот stage.
angels-animals-notes-fish=\n[шрифт=default-bold]рыба[/шрифт]: Catch рыба (4 varieties [img=предмет/raw-рыба] [img=предмет/angels-инопланетный-рыба-1-raw] [img=предмет/angels-инопланетный-рыба-2-raw] [img=предмет/angels-инопланетный-рыба-3-raw]) и breed them as a renewable way из regenerating your health, or as a [img=предмет/angels-био-raw-meat] food для later animals. рыба можно also be processed в oils и [img=предмет/angels-рыба-pulp] pulp для use in similar processes to those used in фермерство. [img=жидкость/angels-жидкий-polluted-рыба-atmosphere] Polluted рыба вода можно be processed to экстракт [img=предмет/angels-кристалл-splinter-raw] кристалл splinters для кристалл переработка.
angels-animals-notes-puffers=\n\n[шрифт=default-bold]PUFFERS[/шрифт]: Explore  planet to find [img=сущность/angels-puffer-гнездо] Puffer Nests to obtain Puffer Eggs (only [img=предмет/angels-био-puffer-1] gaseous puffers можно be found in  wild, [шрифт=default-bold]yellow square[/шрифт] on  map). Breed your smelly puffers to obtain different ways из переработка gasses. Hatching eggs in  разведение cycle gives [img=предмет/angels-био-puffer-яйцо-снаряд] яйцо shells which можно be ground up и combined с polluted рыба вода to produce a higher уровень [img=предмет/angels-кристалл-осколок-raw] кристалл осколок.\n[шрифт=default-bold]NOTES:[/шрифт] Be careful с  mutation chances из puffers.
angels-bioprocessing-animals=[шрифт=default-bold]CATCH, EXPLORE, EGGSPERIMENT[/шрифт]:\n\nThis part из  mod focuses on  wildlife aspects из Nauvis, из рыба фермерство, puffer разведение и raising to разведение biters для продвинутый materials used in things из ракета топливо, modules or продвинутый weapons.\n
angels-bioprocessing-intro=Explore этот инопланетный planet to find  Flora (plant life) и Fauna (animal life) и use it to your advantage. этот mod brings alternatives to petrochemical processes и promotes exploring  surroundings.\n
angels-bioprocessing-intro-animals=\n[шрифт=default-bold]Animal переработка[/шрифт]:\n - [img=предмет/angels-био-refugium-рыба] Some native рыба — a useful source из nutrition и нефть based products.\n - [img=предмет/angels-био-refugium-puffer] Some малый native flying critters — quite handy at переработка dangerous gasses в useful products.
angels-bioprocessing-intro-nauvis=[шрифт=default-bold]Nauvis переработка[/шрифт]:\n - [img=предмет/angels-algae-ферма] Algae фермерство – early фермерство methods для plant matter.\n - [img=предмет/angels-био-arboretum-1] дерево фермерство based on growing native trees для дерево, смола, пластик и резина.\n
angels-bioprocessing-intro-vegetables=\n[шрифт=default-bold]Vegetable переработка[/шрифт]:\n - [img=предмет/angels-desert-сад] Some native plants contain seeds which make useful crops.\n - [img=предмет/angels-культура-ферма] Plant и ферма these crops для useful products.\n
angels-bioprocessing-nauvis=Exploration и exploiting high growth rate algae is  earliest part из этот mod. Finding specialised trees in different biomes allows для  growth из trees in a renewable way, пока algae farms cultivate low grade, high вода-use plant life для useful early materials such as целлюлоза и метанол.\nA sneak peek в how  world used to exploit plant-life для non-food items in  pre-industrialised era.\n\nThis part из  mod is focussed on algae и дерево growth using отходы materials и вода.
angels-bioprocessing-vegetables=By exploring  planet you find [img=предмет/angels-desert-сад][img=предмет/angels-swamp-сад][img=предмет/angels-temperate-сад]gardens that you можно investigate и refine to seeds. These seeds allow you to расти plants yourself. Process these plants для nutrients, топливо и oils. These gardens можно also be processed для [img=предмет/angels-token-био]Plant Life Samples для use in researching продвинутый фермерство buildings such as ферма upgrades, more efficient дерево recipes и more продвинутый processes.\n\nThese gardens — marked с a [шрифт=default-bold]лёгкий green square[/шрифт] on  minimap и — found in different biomes dependant on moisture levels.\n
angels-nauvis-algae=Exploration и exploitation из high growth-rate algae для useful products.\n\n
angels-nauvis-arbor= special trees можно be turned в семя generators. These create seeds для  cost из easy to come-by materials ([предмет=angels-solid-mud], [предмет=angels-solid-почва], [предмет=angels-solid-песок]) и some moisture ([img=жидкость/вода] вода, [img=жидкость/angels-вода-лёгкий-mud] лёгкий mud вода or [img=жидкость/angels-вода-saline] saline-вода).\nThese seeds можно then be cultivated in an [img=предмет/angels-био-arboretum-1] Arboretum to generate [img=предмет/angels-solid-дерево] trees для дерево, or trees и a sap depending on  type из дерево (See предыдущий tip).
angels-nauvis-arbor-compost=\n\n[шрифт=default-bold]NOTES[/шрифт]: To get  почва or fertiliser required для  Arboretums (some recipes won't require either), you will be required to make компост.\n  - [img=предмет/angels-solid-компост] компост можно be generated by sending most из  биообработка materials (algae, дерево, целлюлоза, seeds, crops) to a [img=предмет/angels-composter] Composter.\nFor a full list из compostables, check  ingredient slot on  composter, not all composts — 1 to 1, so keep an eye out для more efficient materials.\nLater technologies will allow you to duplicate these special trees, but you will need to find them in  wild early.
angels-nauvis-notes-algae=\n[шрифт=default-bold]NOTES[/шрифт]: Algae переработка is typically used as an early game method из producing complex materials until other methods можно be used, этот is because биообработка is typically медленный и not as easy to scale up to meet later demands.
angels-nauvis-notes-algae-brown=[шрифт=default-bold]NOTES[/шрифт]: натрий Carbonate was traditionally made by drying и burning seaweed before  industrial revolution found alternative и more sustainable methods.\n              Alginic кислота is typically found in  cell walls из plants. Plant gums contain particularly high concentrations из it. It is quite sticky. для этот reason it можно be used as a binding agent in paper making.\n\n
angels-nauvis-notes-algae-brown-lithia=- Brown algae можно also be processed в [предмет=angels-solid-литий] as an alternative to using [жидкость=angels-тепловой-вода].\n
angels-nauvis-notes-algae-green=[шрифт=default-bold]NOTES[/шрифт]: метанол is colloquially known as дерево alcohol as it was typically made by burning дерево и distilling  vapours.\n\n
angels-nauvis-notes-trees=[шрифт=default-bold]NOTES[/шрифт]: Due to  special дерево placement locations being moisture related и not specific "biomes", mods like инопланетный biomes don't блок дерево spawning.  spawn rates из these trees is quite low though.
angels-nauvis-trees=By exploring  planet you find different types из deciduous trees, in addition to  coniferous trees из  base game.\nExtract seeds out из these trees и start growing your own trees as a renewable source из [предмет=дерево]. More продвинутый переработка leads to more продвинутый дерево growth, allowing you to экстракт смола, пластик и резина out из these special trees.\n\nThese trees — marked с a [шрифт=default-bold]лёгкий blue square[/шрифт] on  minimap и — found in different biomes, dependant on moisture levels.\n
angels-vegetables-crops= results из переработка  crops in  [img=предмет/angels-био-processor]Bioprocessor will выход a specific result(s) based on  рецепт, these можно be a mix из  following:\n
angels-vegetables-farming=Once  gardens have been processed in a [img=предмет/angels-семя-экстрактор]семя экстрактор to get some культура seeds, it is time to plant и cultivate  plants в useful products.\n\n
angels-vegetables-notes-crops=\n\n[шрифт=default-bold]NOTES[/шрифт]:\nOnly [img=предмет/angels-solid-corn]Corn и [img=предмет/angels-solid-fruit]Fruit можно be converted to [img=жидкость/angels-жидкий-брожение-raw]брожение base для conversion to [img=жидкость/angels-газ-этанол]этанол or [img=жидкость/angels-жидкий-acetic-кислота]Acetic-кислота.\nAll non-продвинутый products можно be converted to [img=жидкость/angels-жидкий-nutrient-pulp]Nutrient pulp для conversion to  very useful [img=жидкость/angels-газ-ацетон]ацетон, и a variety из other petrochemical products из oils to syngas.
angels-vegetables-notes-gardens=\n\n[шрифт=default-bold]NOTES[/шрифт]: Due to  сад placement locations being moisture related ( same as trees) и not specific "biomes", mods like инопланетный biomes don't блок сад spawning.  spawn rates из these gardens is quite low though.
; --- angelspetrochem ---
angels-air-filtering=кислород и азот — key base materials для quite a lot из industrial processes, some из which — part из этот mod. для example, using [жидкость=angels-газ-кислород] instead из raw air improves  efficiency из плавка processes. Therefore, being able to separate air в [жидкость=angels-газ-кислород] и [жидкость=angels-газ-азот] is a key технология.
angels-air-filtering-notes=\n\n[шрифт=default-bold]NOTES[/шрифт]: Earth’s atmosphere consists из roughly 21% кислород и 79% азот.\nThis mod uses a different ratio to уменьшить  early отходы из азот газ, и  late game отходы из кислород газ. We можно do that because Nauvis is not Earth.
angels-petrochem=A mod that overhauls petrochemical переработка to be more complex и pseudo-realistic (not overly so).\nRaw resources have to be processed и transformed through химический переработка chains to gain:\n__1__\n  mod also adds a new well: __2__


