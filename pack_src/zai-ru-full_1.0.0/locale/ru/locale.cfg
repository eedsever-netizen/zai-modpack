[tips-and-tricks-sub]
; --- angelsbioprocessing ---
angels-algae-blue=These live off [жидкость=angels-вода-yellow-отходы] и [жидкость=angels-газ-диоксид углерода]. They produce азот-rich compounds like [жидкость=angels-газ-аммиак].\n
angels-algae-brown=These live off [жидкость=angels-вода-saline] и produce [предмет=angels-solid-натрий-carbonate] alongside [предмет=angels-solid-alginic-кислота].  latter можно be combined с  [предмет=angels-целлюлоза-fiber] to produce [предмет=angels-solid-paper].
angels-algae-green=These live off [жидкость=angels-вода-mineralized] и produce [предмет=angels-целлюлоза-fiber] which можно be turned в [жидкость=angels-газ-метанол].
angels-algae-red=These live off [жидкость=angels-тепловой-вода] и [жидкость=angels-газ-аммиак]. They produce кальций-rich compounds such as [предмет=angels-solid-карбонат кальция].\n
angels-crops-special-products=\nIncluding either из  following из  most продвинутый crops ([img=предмет/angels-swamp-5], [img=предмет/angels-temperate-5], [img=предмет/angels-desert-5]):
angels-farm-seeds-to-crops=\nPlace these crops in a [img=предмет/angels-культура-ферма] базовый ферма or  upgraded ферма to match  культура ([img=предмет/angels-swamp-ферма] Swamp, [img=предмет/angels-temperate-ферма] Temperate, [img=предмет/angels-desert-ферма] Desert) to расти  crops.\nProcessing  crops можно be done in a [img=предмет/angels-био-processor] Bioprocessor и  seeds returned  seeds to a [img=предмет/angels-семя-экстрактор] семя экстрактор для regeneration.\n\n
angels-fish-artifacts=Process their вода to экстракт [img=жидкость/angels-инопланетный-spores] инопланетный Spores which можно be processed further для [img=предмет/angels-инопланетный-artifact] инопланетный artifacts.
angels-fish-artifacts-bob=Process their вода to экстракт [img=жидкость/angels-инопланетный-spores] инопланетный Spores which можно be processed further для [img=предмет/bob-инопланетный-artifact] инопланетный artifacts.
angels-trees-desert=A Desert дерево is found in “dry” areas с a preference для moisture contents из вокруг __1__ (Typically sandy/red sandy areas).\nDesert trees — used для дерево production or as an early raw материал для [img=предмет/angels-био-резина] резина production.\n
angels-trees-swamp=A Swamp дерево is found in “wet” areas с a preference для moisture contents из вокруг __1__ (Typically dark-green or blue grassy areas).\nSwamp trees — used для дерево production or для an early raw материал для [img=предмет/angels-био-пластик] пластик production.\n\n
angels-trees-temperate=A Temperate дерево is found in “temperate” areas с a preference для moisture contents из вокруг __1__ (Typically лёгкий green grassy areas).\nTemperate trees — used для дерево production or as  an early raw материал для [img=предмет/angels-био-смола] смола production.\n


