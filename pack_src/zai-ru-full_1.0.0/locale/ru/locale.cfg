[mod-setting-description]
; --- InserterFuelLeech ---
inserter-fuel-leech-chat-log-color=
inserter-fuel-leech-discover-empty-chunks-per-tick=Maximally skip этот many empty chunks per tick when (re)discovering inserters.\nThis is mostly a debug setting.  default should be fine on any system.
inserter-fuel-leech-discover-per-tick=(Re)Discovers этот many inserters already existing on  map per tick.\nIncrease when using mods creating lots из inserters you want to be handled without raising  appropriate events.\nLeave at 1 otherwise. Setting этот to zero will not help UPS issues even when playing on a potato.
inserter-fuel-leech-inserters-enabled= types из inserters для which runtime handling is done.\nThe prototype flag allow_burner_leech is always enabled для all inserters regardless из этот setting.
inserter-fuel-leech-last-inserter-log-color=
inserter-fuel-leech-log-discovery-cycle=Print a message в  chat when an манипулятор (re)discovery cycle ended.
inserter-fuel-leech-log-low-traffic=Print a message в  chat для rare events like a state (re)initialization.
inserter-fuel-leech-missing-power-seconds-to-wait=Seconds to wait before next update when an манипулятор not burning топливо items is unpowered.\nThis also is  reaction delay для when electricity (or fluids для some modded inserters) is restored.\nIncrease этот when experiencing UPS lag in factories that make тяжёлый use из энергия switches or modded жидкость-powered inserters.
inserter-fuel-leech-missing-resource-seconds-to-wait=Seconds to wait before next update when  манипулятор is supposed to get топливо для itself or its target, but there is no топливо to pick up.\nThis also is  reaction delay для when топливо items become available.\nIncrease этот when experiencing UPS lag because из notoriously underfueled smelter columns.
inserter-fuel-leech-no-use-for-fuel-seconds-to-wait=Seconds to wait before next update when  манипулятор or its target don't use топливо items.\nThis also is  reaction delay для changing  манипулятор drop target.\nIncrease этот сначала when experiencing UPS lag.
inserter-fuel-leech-pickup-margin-ticks=Inserters will teleport топливо items в their hand up to этот amount из ticks early из their pickup target or late из their drop target. If этот is too low,  манипулятор may already have picked up another предмет or miss  opportunity to leech из a drop target when timing estimates — off.
inserter-fuel-leech-self-leech-from-drop-enabled=If a burner манипулятор needs топливо, it might take it из its drop target in addition to taking it из  pickup target.
inserter-fuel-leech-self-refuel-cheat-enabled=If a burner манипулятор gets stuck out из топливо и it has топливо in its hand or its pickup target or drop target has топливо, one предмет из that топливо is teleported в  inserters топливо inventory.
inserter-fuel-leech-source-item-count-to-leave= amount из items to leave in a source burner inventory to prevent starvation. Capped to minimum target предмет count - 1. Don't set этот higher than  maximum топливо предмет stack size - 1 or  second сущность in a chain might never get топливо.
inserter-fuel-leech-target-item-count-min= amount из items to maintain in  target inventory. Vanilla манипулятор behavior is to вставить 5 топливо items в non-транспорт топливо inventories.
inserter-fuel-leech-vanilla-self-refuel-seconds-to-wait=Seconds to wait before next update when an манипулятор burning топливо items has no топливо items и можно refuel из a burner inventory at  pickup location (standard engine behavior) [s]
inserter-fuel-leech-wait-variation-seconds=Maximum duration in seconds to add to  предыдущий wait durations to help spreading  update load evenly.\nIncrease этот if experiencing recurring UPS spikes in an interval that matches one из  other settings для some time after building lots из inserters in a short time рама.\nIncreasing этот doesn't help when UPS is continously below 60.
inserter-fuel-leech-watch-last-inserter=Spams your personal chat с loads из messages для  last-built манипулятор meant to aid in debugging из этот mod's control script.\nThe watched манипулятор is  last built by you. построить и удалить an манипулятор to stop watching.
; --- NapusJaggedOres ---
coal-weight=этот decides how much уголь should spawn compared to  other руды values.
copper-weight=этот decides how much медь should spawn compared to  other руды values.
generationMethod=Defines  method to use для руда generation.
iron-weight=этот decides how much железо should spawn compared to  other руды values.
ore-refining=Defines wether or not all руды has to be refined before they можно be used.
ore-scaling= pace at which  руды увеличить. этот value is multiplied onto  руды.
starting-radius= radius из which there's no руды.
stone-weight=этот decides how much камень should spawn compared to  other руды values.
; --- Peppermint_Mining ---
nougat-mode=Automatically мина руды in range из roboports.
nougat-use-construction-range=Roboports will мина out to their строительство radius (otherwise use логистический raidus)
; --- StatsGui-MovementSpeed ---
statsgui-ms-max-speed-vehicle=not really correct values
; --- angelsaddons-cab ---
angels-cab-energy-transfer-rate= энергия transfer этот transfer port можно deliver, in watts.\nDefault: __1__ W
; --- angelsaddons-mobility ---
angels-crawlertrain-tier-amount=Number из tiers. поезда scale by about 25% per уровень.
angels-petrotrain-tier-amount=Number из tiers. поезда scale by about 25% per уровень.
angels-smeltingtrain-tier-amount=Number из tiers. поезда scale by about 25% per уровень.
; --- angelsaddons-storage ---
angels-enable-storage-icon-scaling=Icons on silos и warehouses scale to size из  silos и warehouses, instead из being малый.
; --- angelsbioprocessing ---
angels-bio-tile-pollution-absorbtion-multiplier=Increases  pollution absorption to уменьшить  pollution cloud in your base.
; --- auto-splitter-block ---
auto-splitter-block-enable-for-automated-builds=Apply auto-blocking when entities — built by __ENTITY__construction-robot__ or __TECHNOLOGY__space-platform__. Disable этот if blueprint-configured splitter filters — being overwritten.
auto-splitter-block-filter-item= предмет to use as  splitter output фильтр для blocking. Pick an предмет that is not normally carried on belts. A blueprint using an предмет из another mod does not import where that mod is missing. After changing этот setting, filters set с  предыдущий предмет — no longer cleared automatically.
auto-splitter-block-unhide-no-item=Unhides  base game's [предмет=no-предмет] __ITEM__no-item__ предмет so it можно be selected manually in normal фильтр UIs (splitters, inserters, logistics requests, etc.). этот affects every фильтр UI in  game, not just splitters.
; --- auto-train-manager ---
atm-block-margin=Extra tiles added to  блок length.
atm-default-train-length=Used when no поезд is found on or scheduled to  selected rails.
atm-drive-side=Side поезда keep to on unsignalled double track. Used to guess directions when no сигналы, stations or поезда say otherwise.
atm-train-length-override=If above 0, always use этот many carriages instead из detecting поезда.
atm-zone-gap=Junctions closer than этот — signalled as one zone, с chain сигналы between them, so a поезд never waits с its tail in  junction behind. Safest at  поезд length (e.g. 44), but поезда then wait much longer: on  test save, 8 tiles cut time stopped at сигналы из about 1,800 to 130 поезд-seconds per hour с no lockups. Below about 8, pieces из one junction get split apart.
; --- dangOreus ---
dangOre-mode=Style из руда layout. Locked in on map start.
easy-mode=Allow building belts и энергия poles on руда.
floor-is-lava=INTENDED для PUBLIC MULTIPLAYER - руда можно damage  player. Intended to limit exploration.
non-colliding-resources=большой resources won't generate in overlapping positions
simple-ore-radius=RANDOM MODE ONLY - уран (or other жидкость-required руды) will not be generated within этот radius.
square-mode=руда is generated in a neat square для easier добыча
voronoi-scale-factor=Larger numbers will make features larger
; --- gizmod ---
gizmod-color-mask=RGBA tint applied to neutral interface sprites.
gizmod-custom-item-type-tabs=Comma-separated match list. Each entry creates its own Gizmod crafting tab и moves matching items/recipes by name, subgroup, subgroup group, рецепт category, or prototype type. Examples: полуфабрикат, руда, модуль.
gizmod-enable-barreling-tab=Creates a Gizmod Barreling crafting tab и moves бочка/fill/empty бочка items и recipes в it. Startup setting; requires prototype rebuild.
gizmod-enable-bioprocessing-tab=Creates a Gizmod биообработка crafting tab и moves био/agriculture/spoilage/nutrient-style items и recipes в it when present. Startup setting; requires prototype rebuild.
gizmod-enable-burner-fuel-leeching=When enabled, burner-powered inserters можно refuel themselves из  топливо inventory из  сущность they — picking up из. этот is a startup setting и requires a restart/map reload to change prototype behavior.
gizmod-enable-color-mask=Enables Gizmod's built-in interface цвет mask. этот tints neutral UI sprites и можно affect standard GUI sprites used by other mods.
gizmod-enable-damage-numbers=When enabled, Gizmod listens для сущность damage и displays floating damage numbers.
gizmod-enable-floating-text=Master switch для Gizmod's shared rendering.draw_text floating text service.
gizmod-enable-science-pack-tab=Creates a Gizmod Science Packs crafting tab и moves science pack items и recipes в it. Startup setting; requires prototype rebuild.
gizmod-floating-text-color-mode=Rainbow gives each spawned text a rotating bright цвет. Bordered white draws a black outline/shadow с white fill.
gizmod-floating-text-max-active=Maximum active floating text groups. Older entries — removed сначала.
gizmod-floating-text-style=Magic uses a larger dramatic built-in шрифт. Standard uses a smaller bold built-in шрифт.
gizmod-floating-text-ttl=How long floating text remains alive, in ticks. 60 ticks is one second.
gizmod-white-level=Brightness variant для  GUI tileset. Higher values make  interface lighter; very лёгкий values may уменьшить text readability.
tlst-show-active-task= active задача is  topmost "in progress" задача on your list that is at  root level (not a subtask).
; --- omnimatter_science ---
omniscience-chain-constant=Constant used to determine технология cost увеличить для sequences из technologies с only one prerequisite.
omniscience-chain-omnitech-constant=Constant used to determine технология cost увеличить для sequences из Omnimatter technologies с only one prerequisite.
omniscience-cumulative-constant=этот constant is multiplied с  original cost из all technologies. этот makes a малый difference early in  дерево, but  further down it goes,  bigger  effect is. Does NOT affect omnimatter technologies.
omniscience-cumulative-constant-omni=этот constant is multiplied с  original cost из all omnimatter technologies. этот makes a малый difference early in  дерево, but  further down it goes,  bigger  effect is. ONLY affects omnimatter technologies.
omniscience-cumulative-count=с этот on, learning new технология will cost  sum из all techs prior to it, including  original cost. этот option takes precedence over all others if active.
omniscience-exponential= технология cost will увеличить exponentially by how far in  дерево  технология is, only  largest value applies.
omniscience-exponential-base= multiplicative base для which  exponential cost is calculated. ( a in a^x).
omniscience-exponential-initial= initial cost из technologies without prerequisites.
omniscience-modify-costs=Changes all  tech costs according to choosen model.
omniscience-modify-omnimatter-costs=Determines if  original technologies из omnimatter — effected or not.
omniscience-omnitech-max-constant=Maximum value that  Omnitech constant можно reach.
omniscience-rocket-modified-by-omni=Is  ракета бункер tech affected by  omnimatter tech? Is it dependent upon them, or not?
omniscience-standard-time=Enable  standard исследование iteration time.
omniscience-standard-time-constant=Makes it so all techs take equally long on each iteration.
; --- show-max-underground-distance ---
show-max-underground-distance-on-hover=Show  maximum distance when hovering over a placed конвейер or труба
; --- spider-mines ---
spider-mines-arm-delay=Ticks after deployment before a паук мина starts scanning.
spider-mines-batch-size=Maximum паук Mines processed per tick. Higher values — more responsive; lower values — lighter on very большой minefields.
spider-mines-chase-timeout=Ticks a паук мина можно chase before giving up explosively.
spider-mines-scan-radius=How far each armed паук мина scans для enemies. Default: 12 tiles.


